# One-time setup, applied by a cluster administrator, never by the
# pipeline (docs/deploy-acs.md 3.2):
#
#   sed 's/__namespace__/iam-passport-prod/g' deployments/cluster-setup.yaml | kubectl apply -f -
#
# Creates the namespace and iam-deployer, the identity Jenkins
# deploys with. iam-deployer may do anything inside the namespace and nothing
# outside it, apart from the one ClusterRole the authentik chart installs for
# its outpost controller (listing CRDs) and that role's binding.
apiVersion: v1
kind: Namespace
metadata:
  name: __namespace__
  labels:
    app.kubernetes.io/part-of: iam-passport
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iam-deployer
  namespace: __namespace__
automountServiceAccountToken: false
---
# The long-lived token Jenkins' kubeconfig credential carries. Rotate it by
# deleting this Secret and applying the file again.
apiVersion: v1
kind: Secret
metadata:
  name: iam-deployer-token
  namespace: __namespace__
  annotations:
    kubernetes.io/service-account.name: iam-deployer
type: kubernetes.io/service-account-token
---
# Everything in the namespace: the authentik chart creates a Role there, and
# Kubernetes only lets an account grant permissions it holds itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iam-deployer
  namespace: __namespace__
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iam-deployer
  namespace: __namespace__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iam-deployer
subjects:
  - kind: ServiceAccount
    name: iam-deployer
    namespace: __namespace__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: iam-deployer-__namespace__
rules:
  # Held so that the chart's ClusterRole, which grants exactly this, may be
  # created and bound.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["list"]
  # Kubernetes cannot limit create to a name.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    resourceNames: ["authentik-__namespace__"]
    verbs: ["get", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: iam-deployer-__namespace__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: iam-deployer-__namespace__
subjects:
  - kind: ServiceAccount
    name: iam-deployer
    namespace: __namespace__
