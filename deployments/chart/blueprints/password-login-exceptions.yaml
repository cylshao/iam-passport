# Password login: accounts the Feishu sync created must scan with Feishu, unless
# they are in the 密码登录例外 group; every password login must pass MFA
# (docs/authentik.md section 3).
#
# Only adds stages and bindings to default-authentication-flow. The default
# flow's own stages belong to authentik's default blueprint, which re-applies
# them, so they are left untouched. Feishu logins go through
# default-source-authentication and are not affected.
#
#   order 15  deny feishu-managed accounts outside the exception group
#   order 20  default password stage
#   order 30  default MFA validation: checks a device if the user has one
#   order 31  users with no device must set up TOTP before logging in
version: 1
metadata:
  name: iam-passport - Password login only for exceptions, always with MFA
entries:
  # Membership is maintained by admins; the blueprint never sets users.
  - model: authentik_core.group
    id: exceptions
    identifiers:
      name: 密码登录例外

  - model: authentik_policies_expression.expressionpolicy
    id: managed-outside-exceptions
    identifiers:
      name: password-login-only-exceptions
    attrs:
      expression: |
        user = request.context.get("pending_user")
        if not (user and user.attributes.get("feishu_managed")):
            return False
        return not ak_is_group_member(user, name="密码登录例外")
  - model: authentik_stages_deny.denystage
    id: deny
    identifiers:
      name: password-login-only-exceptions-deny
    attrs:
      deny_message: 员工账号请用飞书扫码登录。确实需要用密码登录的，请联系管理员。
  - model: authentik_flows.flowstagebinding
    id: deny-binding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf deny
    attrs:
      order: 15
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf deny-binding
      policy: !KeyOf managed-outside-exceptions
    attrs:
      order: 0

  - model: authentik_policies_expression.expressionpolicy
    id: no-mfa-device
    identifiers:
      name: password-login-no-mfa-device
    attrs:
      expression: |
        from authentik.stages.authenticator import devices_for_user
        user = request.context.get("pending_user")
        return bool(user) and not any(True for _ in devices_for_user(user))
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: require-mfa
    identifiers:
      name: password-login-require-mfa
    attrs:
      device_classes: [totp, webauthn, static]
      not_configured_action: configure
      configuration_stages:
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
  - model: authentik_flows.flowstagebinding
    id: require-mfa-binding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf require-mfa
    attrs:
      order: 31
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf require-mfa-binding
      policy: !KeyOf no-mfa-device
    attrs:
      order: 0
