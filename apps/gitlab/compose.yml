# 本地验证用的 GitLab CE，通过 OIDC 接入本地 authentik（http://localhost:9000）。
# 只用于验证单点登录的配置和账号行为，不要用于生产。步骤见 docs/gitlab.md 第 8 节。
#
# 浏览器访问 authentik 用 localhost:9000；GitLab 容器里的 localhost 是它自己，
# 所以服务端调用（换 token、取用户信息、取公钥）走 host.docker.internal:9000，
# 并关闭 discovery，逐个写明地址。authentik 按 token 请求的地址生成 issuer，
# 所以 issuer 也写 host.docker.internal。
services:
  gitlab:
    image: gitlab/gitlab-ce:${GITLAB_TAG:-19.4.5-ce.0}
    hostname: localhost
    ports:
      - 127.0.0.1:8929:8929
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
        gitlab_rails['initial_root_password'] = '${GITLAB_ROOT_PASSWORD:?GITLAB_ROOT_PASSWORD required}'

        # 本地内存有限，关掉用不到的组件
        puma['worker_processes'] = 0
        sidekiq['concurrency'] = 5
        prometheus_monitoring['enable'] = false
        gitlab_kas['enable'] = false
        registry['enable'] = false

        gitlab_rails['omniauth_enabled'] = true
        gitlab_rails['omniauth_allow_single_sign_on'] = ['openid_connect']
        gitlab_rails['omniauth_block_auto_created_users'] = false
        gitlab_rails['omniauth_providers'] = [
          {
            name: 'openid_connect',
            label: '公司账号（飞书扫码）',
            args: {
              name: 'openid_connect',
              scope: ['openid', 'profile', 'email'],
              response_type: 'code',
              issuer: 'http://host.docker.internal:9000/application/o/gitlab/',
              discovery: false,
              uid_field: 'sub',
              pkce: true,
              client_options: {
                identifier: '${OIDC_CLIENT_ID:?OIDC_CLIENT_ID required}',
                secret: '${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET required}',
                redirect_uri: 'http://localhost:8929/users/auth/openid_connect/callback',
                scheme: 'http',
                host: 'host.docker.internal',
                port: 9000,
                # 都要写完整地址：GitLab 取公钥时不会补上 host
                authorization_endpoint: 'http://localhost:9000/application/o/authorize/',
                token_endpoint: 'http://host.docker.internal:9000/application/o/token/',
                userinfo_endpoint: 'http://host.docker.internal:9000/application/o/userinfo/',
                jwks_uri: 'http://host.docker.internal:9000/application/o/gitlab/jwks/',
                end_session_endpoint: 'http://localhost:9000/application/o/gitlab/end-session/'
              }
            }
          }
        ]
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    shm_size: 256m

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
